; PlatformIO project for the ESP32 port of the panel firmware - two
; environments sharing everything except the transport-specific entry
; point (see build_src_filter): esp32-classic speaks Bluetooth Classic SPP
; (works with the original ESP32, matches what the Pi already does, no
; Android app changes needed for the transport itself), esp32-s3-ble speaks
; BLE GATT (the S3 variant has no classic Bluetooth radio at all).
[env]
; pioarduino rather than the stock espressif32 platform: stock is stuck on
; Arduino core 2.0.17, whose classic Bluetooth SDP responder a Pixel 9
; (Android 17) can't complete service discovery against - connections
; time out before reaching the firmware. Core 3.x works.
; Pinned (not "stable"): core 4.0 stops enabling BluetoothSerial by default.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
lib_deps =
	https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
	adafruit/Adafruit GFX Library@^1.11.9
build_flags =
	-std=gnu++17
	-Wall
build_unflags =
	-std=gnu++11

[env:esp32-classic]
board = esp32dev
build_src_filter = +<*> -<main_ble.cpp> -<main_test_pattern.cpp>

[env:esp32-s3-ble]
board = esp32-s3-devkitc-1
build_src_filter = +<*> -<main_classic.cpp> -<main_test_pattern.cpp>

; Standalone HUB75 bring-up test (main_test_pattern.cpp) - fills the panel
; with solid colors using the library's default pin mapping, no Bluetooth
; involved. Use this first to confirm the adapter board's wiring before
; flashing the real firmware.
[env:esp32-test-pattern]
board = esp32dev
build_src_filter = +<*> -<main_classic.cpp> -<main_ble.cpp>
